# Publishes this package to npm when a version tag is pushed (v1.2.3 or v1.2.3-beta.0). No token:
# npm trusts this repository and workflow (Trusted Publishing, OIDC) and attaches provenance.
# Until a stable version exists a prerelease goes out as `latest`, so a plain install gets the newest
# beta; after that prereleases go to `next`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; npm 12 turns dependency install scripts off, which the
      # test toolchain (esbuild) still needs, so stay on 11.
      - run: npm install -g npm@^11.5.1
      - name: the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag=latest
          if [ "${version#*-}" != "$version" ]; then
            stable=$(npm view "$name" versions --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let v=[];try{v=[].concat(JSON.parse(s||'[]'))}catch{};console.log(v.some(x=>!x.includes('-'))?'yes':'')})")
            [ -n "$stable" ] && tag=next
          fi
          npm publish --access public --tag "$tag"
