                      properties:
                        slug: { type: string }
                        name: { type: string }
                        samples: { type: integer, description: Readings in the month, ok or not. }
                        ok_share: { type: number, minimum: 0, maximum: 1 }
                        price_sun_1h: { $ref: "#/components/schemas/MarketPriceStats" }
                        price_sun_1d: { $ref: "#/components/schemas/MarketPriceStats" }
