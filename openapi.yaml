        our own live price (`slug: tenergy`). Sorted by `price_sun_1h`, cheapest first; unpriced
        providers last. `savings_pct` = 1 − price /
        `burn_sun`; `stale` = the price row is older than 15 min (or missing). Anonymous; a
        presented key only buys the per-key budget.
      security:
